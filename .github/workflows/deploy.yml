name: Garten24h zu Hetzner deployen

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: garten24h-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Website laden
        uses: actions/checkout@v4

      - name: Fertige Website per SFTP veröffentlichen
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          password: ${{ secrets.HETZNER_PASSWORD }}
          port: ${{ secrets.HETZNER_PORT }}
          local_path: ./dist/*
          remote_path: ./
          sftp_only: true
          delete_remote_files: false
